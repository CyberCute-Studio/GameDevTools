name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $changed = go fmt ./...
          if ($LASTEXITCODE -ne 0) { throw "go fmt failed with exit code $LASTEXITCODE" }
          if ($changed) {
            $changed
            throw "Formatting changes are required. Run 'go fmt ./...'."
          }

      - name: Run static analysis
        run: go vet ./...

      - name: Run unit tests
        run: go test -count=1 ./...

      - name: Build Windows AMD64 release executable
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: ./scripts/build.ps1 -Configuration Release -OutputPath bin/gamedevtools-windows-amd64.exe

      - name: Check release toolchain
        shell: pwsh
        run: |
          $pinned = (Select-String -Path go.mod -Pattern '^toolchain (go\S+)$').Matches.Groups[1].Value
          if (-not $pinned) { throw "go.mod names no toolchain." }
          $reported = go version bin/gamedevtools-windows-amd64.exe
          if ($LASTEXITCODE -ne 0) { throw "go version failed with exit code $LASTEXITCODE" }
          $built = ($reported -split '\s+')[-1]
          if ($built -ne $pinned) { throw "The release executable was built with $built, but go.mod pins $pinned." }
          Write-Output "Release executable built with $built."

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: gamedevtools-windows-amd64
          path: bin/gamedevtools-windows-amd64.exe
          if-no-files-found: error
