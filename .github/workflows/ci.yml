name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $changed = go fmt ./...
          if ($LASTEXITCODE -ne 0) { throw "go fmt failed with exit code $LASTEXITCODE" }
          if ($changed) {
            $changed
            throw "Formatting changes are required. Run 'go fmt ./...'."
          }

      - name: Run static analysis
        run: go vet ./...

      # One package at a time, as scripts/validate.ps1 does: overlay tests show
      # topmost windows over the whole desktop and the real picker test takes
      # the foreground, either of which can disturb a test running beside them.
      - name: Run unit tests
        run: go test -count=1 -p 1 ./...

      - name: Build portable x64 package
        shell: pwsh
        run: ./scripts/package.ps1 -OutputDirectory bin/release

      - name: Check release toolchain
        shell: pwsh
        run: |
          $pinned = (Select-String -Path go.mod -Pattern '^toolchain (go\S+)$').Matches.Groups[1].Value
          if (-not $pinned) { throw "go.mod names no toolchain." }
          $reported = go version bin/release/cybercute-dev-tools.exe
          if ($LASTEXITCODE -ne 0) { throw "go version failed with exit code $LASTEXITCODE" }
          $built = ($reported -split '\s+')[-1]
          if ($built -ne $pinned) { throw "The release executable was built with $built, but go.mod pins $pinned." }
          Write-Output "Release executable built with $built."

      - name: Verify portable package
        shell: pwsh
        run: ./scripts/verify-package.ps1 -Package (Get-ChildItem bin/release/*.zip).FullName

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: cybercute-dev-tools-windows-x64
          path: |
            bin/release/*.zip
            bin/release/*.zip.sha256
          if-no-files-found: error
